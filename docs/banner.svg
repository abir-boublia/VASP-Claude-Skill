<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 400" role="img" aria-labelledby="title desc">
  <title id="title">VASP — from setup to insight</title>
  <desc id="desc">An AI skill for density functional theory workflows.</desc>

  <!-- background -->
  <rect width="1440" height="400" fill="#FFFFFF"/>

  <!-- VASP logo -->
  <image x="70" y="60" width="320" height="72"
         href="data:image/png;base64,"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- full name -->
  <text x="230" y="175" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="13" font-weight="700" letter-spacing="1.8" fill="#2C3E50">
    VIENNA AB INITIO
  </text>
  <text x="230" y="195" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="13" font-weight="700" letter-spacing="1.8" fill="#2C3E50">
    SIMULATION PACKAGE
  </text>

  <!-- vertical divider -->
  <line x1="490" y1="40" x2="490" y2="340" stroke="#C0325A" stroke-width="2.5"/>

  <!-- headline -->
  <text x="540" y="130" fill="#1A1F3D"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="48" font-weight="700" letter-spacing="-0.5">
    VASP,
  </text>
  <text x="540" y="190" fill="#1A1F3D"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="48" font-weight="700" letter-spacing="-0.5">
    from setup to insight
  </text>

  <!-- subtitle -->
  <text x="542" y="240" fill="#6B7B8D"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="20">
    An AI skill for density functional theory workflows.
  </text>

  <!-- bottom rule -->
  <line x1="60" y1="365" x2="1380" y2="365" stroke="#EAEAEA" stroke-width="1"/>

</svg>
